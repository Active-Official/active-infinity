name: CI
# Action pins (R2-CI-01): every `uses:` in this file is pinned to a full
# 40-hex commit SHA, never a floating tag. SHAs for actions also used by
# active-rpc are copied verbatim from that repo's workflows; the rest are
# the upstream tag's commit at pin time (version in the trailing comment).
# The `pin-lint` job in ci.yml fails CI if any pin drifts; pins are kept
# current by Dependabot (`.github/dependabot.yml`, github-actions ecosystem).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Invariant gate (secret canary and capability authority)
        run: cargo test --locked --all-features --test invariant_gate
      - name: Tests (no default features)
        run: cargo test --locked --no-default-features
      - name: Documentation
        env:
          # A broken intra-doc link is a documentation defect, not a warning.
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Benchmarks compile
        run: cargo bench --locked --bench codec --no-run

  gates-windows:
    # XPL-01: the Windows leg of the gates. Mirrors `gates` step for step -
    # do not invent a different gate set for Windows. INFORMATIONAL until
    # green: add to the branch's required-status checks once the XPL-INF
    # fixes land and this job goes green. If a test fails only on Windows
    # for a legitimate platform reason, the fix belongs to that finding -
    # never weaken this job to green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Enable Developer Mode (symlink privilege for store tests)
        # XPL-INF-07: three store tests plant symlinks; on Windows that
        # needs Developer Mode or SeCreateSymbolicLinkPrivilege. The tests
        # fall back to a non-privileged fixture when the privilege is
        # absent, but the symlink leg is the sharper case and must run in
        # CI. Takes effect immediately; no reboot. The runner is ephemeral.
        shell: powershell
        run: |
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Tests
        run: cargo test --locked --all-features
      - name: Invariant gate (secret canary and capability authority)
        run: cargo test --locked --all-features --test invariant_gate
      - name: Tests (no default features)
        run: cargo test --locked --no-default-features
      - name: Documentation
        env:
          # A broken intra-doc link is a documentation defect, not a warning.
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Benchmarks compile
        run: cargo bench --locked --bench codec --no-run

  gates-macos:
    # XPL-01: the macOS leg of the gates. Mirrors `gates` step for step.
    # No macOS execution of these suites exists anywhere today; this job is
    # the first. INFORMATIONAL until green: add to the branch's
    # required-status checks once the XPL-INF fixes land and this job goes
    # green. If a test fails only on macOS for a legitimate platform
    # reason, the fix belongs to that finding - never weaken this job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Invariant gate (secret canary and capability authority)
        run: cargo test --locked --all-features --test invariant_gate
      - name: Tests (no default features)
        run: cargo test --locked --no-default-features
      - name: Documentation
        env:
          # A broken intra-doc link is a documentation defect, not a warning.
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Benchmarks compile
        run: cargo bench --locked --bench codec --no-run

  pin-lint:
    # R2-NEW-01: the pin state is a gate, not a convention. Fails when any
    # `uses:` in .github/workflows/*.yml is not a full 40-hex commit SHA,
    # or any `cargo install` lacks --version. See scripts/check_action_pins.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check action pins
        run: python3 scripts/check_action_pins.py .github/workflows

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run the machine-portable perf gate
        run: |
          cargo run --release --locked --quiet --example perf_matrix --all-features > perf-matrix.json
          python3 scripts/perf_gate.py perf-matrix.json
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: perf-matrix
          path: perf-matrix.json

  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: ABI tests (validate, hash, reencode, redaction)
        working-directory: ffi/active-infinity-ffi
        run: cargo test --locked --release
      - name: Build the static library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Compile and run the C consumer
        run: |
          gcc -I ffi/active-infinity-ffi/include polyglot/c/consumer.c \
            ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
            -lpthread -ldl -lm -o /tmp/active-infinity-c
          # INF-POLY-02: pass the manifest hash so the consumer compares
          # it instead of only printing it.
          HASH=$(python3 -c "import json; print([c['content_hash'] for c in json.load(open('conformance/manifest.json'))['cases'] if c['path']=='tests/vectors/valid/full.ainf'][0])")
          /tmp/active-infinity-c tests/vectors/valid/full.ainf "$HASH"
      - name: C consumer on the invalid vectors (INF-POLY-02)
        run: |
          # Every invalid vector except the two limits-dependent ones
          # (limit, too_deep) must be refused with its declared code.
          # INF-FFI-02: the two limits-dependent vectors carry their narrowed
          # budget as a third column and go through the consumer's --limits
          # flag; the rest pass `-` and run as before.
          python3 -c "import json; [print(c['path'], c['expected_code'], c.get('options', {}).get('limits', '-')) for c in json.load(open('conformance/manifest.json'))['cases'] if c['kind']=='invalid']" > invalid-vectors.txt
          while read -r path code limits; do
            code="${code%$'\r'}"
            limits="${limits%$'\r'}"
            if [ "$limits" = "-" ]; then
              /tmp/active-infinity-c "$path" --expect-code "$code" || exit 1
            else
              /tmp/active-infinity-c "$path" --expect-code "$code" --limits "$limits" || exit 1
            fi
          done < invalid-vectors.txt

  abi-windows-macos:
    # XPL-INF-06: the FFI crate is the shared library every binding loads,
    # and the `abi` job only ever built it on Linux. This job proves the
    # crate builds, passes its tests and links into the C consumer on
    # Windows and macOS too. The C consumer link line is per-OS: the static
    # library is `libactive_infinity_ffi.a` on Linux and macOS, and `-ldl`
    # exists only on Linux. On Windows the consumer links the cdylib's
    # import library instead: MinGW gcc cannot link the MSVC static library
    # (`active_infinity_ffi.lib` holds MSVC objects, __chkstk / C++ RTTI).
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: ABI tests (validate, hash, reencode, redaction)
        working-directory: ffi/active-infinity-ffi
        run: cargo test --locked --release
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Compile and run the C consumer
        shell: bash
        run: |
          # INF-POLY-02: pass the manifest hash so the consumer compares
          # it instead of only printing it.
          HASH=$(python3 -c "import json; print([c['content_hash'] for c in json.load(open('conformance/manifest.json'))['cases'] if c['path']=='tests/vectors/valid/full.ainf'][0])")
          if [ "$RUNNER_OS" = "Windows" ]; then
            gcc -I ffi/active-infinity-ffi/include polyglot/c/consumer.c \
              ffi/active-infinity-ffi/target/release/active_infinity_ffi.dll.lib \
              -lpthread -lm -o active-infinity-c.exe
            cp ffi/active-infinity-ffi/target/release/active_infinity_ffi.dll .
            ./active-infinity-c.exe tests/vectors/valid/full.ainf "$HASH"
          else
            cc -I ffi/active-infinity-ffi/include polyglot/c/consumer.c \
              ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
              -lpthread -lm -o active-infinity-c
            ./active-infinity-c tests/vectors/valid/full.ainf "$HASH"
          fi
      - name: C consumer on the invalid vectors (INF-POLY-02)
        shell: bash
        run: |
          # Every invalid vector except the two limits-dependent ones
          # (limit, too_deep) must be refused with its declared code. The
          # FFI exposes no limits parameter, so those two need narrowed
          # limits and are covered by the CLI's `conformance run` and the
          # Rust suite instead.
          if [ "$RUNNER_OS" = "Windows" ]; then
            CONSUMER=./active-infinity-c.exe
          else
            CONSUMER=./active-infinity-c
          fi
          python3 -c "import json; [print(c['path'], c['expected_code'], c.get('options', {}).get('limits', '-')) for c in json.load(open('conformance/manifest.json'))['cases'] if c['kind']=='invalid']" > invalid-vectors.txt
          while read -r path code limits; do
            code="${code%$'\r'}"
            limits="${limits%$'\r'}"
            if [ "$limits" = "-" ]; then
              "$CONSUMER" "$path" --expect-code "$code" || exit 1
            else
              "$CONSUMER" "$path" --expect-code "$code" --limits "$limits" || exit 1
            fi
          done < invalid-vectors.txt

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the shared WASM module
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: JavaScript conformance
        run: node polyglot/js/test.js
      - name: Random-fill regression (INF-POLY-01)
        run: node polyglot/js/test_random_fill.js

  polyglot-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: C++ consumer
        run: |
          g++ -std=c++17 -I ffi/active-infinity-ffi/include -I polyglot/cpp \
            polyglot/cpp/test.cpp \
            ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
            -lpthread -ldl -lm -o /tmp/active-infinity-cpp
          # INF-POLY-02: pass the manifest hash so the consumer compares
          # it instead of only printing it.
          HASH=$(python3 -c "import json; print([c['content_hash'] for c in json.load(open('conformance/manifest.json'))['cases'] if c['path']=='tests/vectors/valid/full.ainf'][0])")
          /tmp/active-infinity-cpp tests/vectors/valid/full.ainf "$HASH"
      - name: C++ consumer on the invalid vectors (INF-POLY-02)
        run: |
          # Every invalid vector except the two limits-dependent ones
          # (limit, too_deep) must be refused with its declared code.
          # INF-FFI-02: the two limits-dependent vectors carry their narrowed
          # budget as a third column and go through the consumer's --limits
          # flag; the rest pass `-` and run as before.
          python3 -c "import json; [print(c['path'], c['expected_code'], c.get('options', {}).get('limits', '-')) for c in json.load(open('conformance/manifest.json'))['cases'] if c['kind']=='invalid']" > invalid-vectors.txt
          while read -r path code limits; do
            code="${code%$'\r'}"
            limits="${limits%$'\r'}"
            if [ "$limits" = "-" ]; then
              /tmp/active-infinity-cpp "$path" --expect-code "$code" || exit 1
            else
              /tmp/active-infinity-cpp "$path" --expect-code "$code" --limits "$limits" || exit 1
            fi
          done < invalid-vectors.txt
      - name: Python conformance
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: python3 polyglot/python/test_conformance.py
      - name: Zig consumer
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build and run Zig
        working-directory: polyglot/zig
        run: |
          zig build
          # INF-POLY-02: pass the manifest hash so the consumer compares
          # it instead of only printing it.
          HASH=$(python3 -c "import json; print([c['content_hash'] for c in json.load(open('../../conformance/manifest.json'))['cases'] if c['path']=='tests/vectors/valid/full.ainf'][0])")
          LD_LIBRARY_PATH=${{ github.workspace }}/ffi/active-infinity-ffi/target/release \
            ./zig-out/bin/active-infinity-zig ../../tests/vectors/valid/full.ainf "$HASH"
      - name: Zig consumer on the invalid vectors (INF-POLY-02)
        working-directory: polyglot/zig
        run: |
          # Every invalid vector must be refused with its declared code.
          # INF-FFI-02: the two limits-dependent vectors carry their narrowed
          # budget as a third column and go through the consumer's --limits
          # flag; the rest pass `-` and run as before.
          python3 -c "import json; [print('../../' + c['path'], c['expected_code'], c.get('options', {}).get('limits', '-')) for c in json.load(open('../../conformance/manifest.json'))['cases'] if c['kind']=='invalid']" > ../../invalid-vectors.txt
          while read -r path code limits; do
            LD_LIBRARY_PATH=${{ github.workspace }}/ffi/active-infinity-ffi/target/release \
              code="${code%$'\r'}"
              limits="${limits%$'\r'}"
              if [ "$limits" = "-" ]; then
                ./zig-out/bin/active-infinity-zig "$path" --expect-code "$code" || exit 1
              else
                ./zig-out/bin/active-infinity-zig "$path" --expect-code "$code" --limits "$limits" || exit 1
              fi
          done < ../../invalid-vectors.txt

  polyglot-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the shared WASM module
        working-directory: ffi/active-infinity-ffi
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: Go conformance
        working-directory: polyglot/go
        run: go test ./...

  polyglot-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the shared WASM module
        working-directory: ffi/active-infinity-ffi
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: TypeScript conformance
        run: |
          npx --yes -p typescript@5.7.2 tsc -p polyglot/ts/tsconfig.json
          node polyglot/ts-build/conformance.js
      - name: JavaScript conformance
        run: node polyglot/js/test.js

  polyglot-scripting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Install scripting runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full php-cli php-ffi luajit
          sudo gem install ffi --no-document
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Ruby
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: ruby polyglot/ruby/test/test_conformance.rb
      - name: PHP
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: php polyglot/php/test.php
      - name: Lua
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: luajit polyglot/lua/test.lua
      - name: Dart
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: dart run polyglot/dart/bin/conformance.dart

  polyglot-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: C# conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release
        run: dotnet run -c Release --project polyglot/csharp/Conformance

  polyglot-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Kotlin compiler
        run: |
          curl -fL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Java
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release
        run: bash polyglot/java/build.sh
      - name: Kotlin/JVM
        run: bash polyglot/kotlin/build.sh
      - name: Scala
        env:
          SCALA_CLI: /tmp/scala-cli
        run: bash polyglot/scala/build.sh

  polyglot-kotlin-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache the Kotlin/Native compiler
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/kotlin-native-cache
          key: kotlin-native-2.0.21
      - name: Kotlin/Native conformance
        env:
          POLYGLOT_CACHE: /tmp/kotlin-native-cache
        run: bash polyglot/kotlin-native/build.sh

  polyglot-swift:
    # Pinned LTS: `ubuntu-latest` moved to 26.04, which ships no Swift and is
    # not a target for the toolchain setup action.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The runner image no longer guarantees a Swift toolchain, and the
      # conformance job used to rely on whatever the image happened to ship.
      # Pin it like every other toolchain in this workflow.
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Swift conformance
        run: |
          cd polyglot/swift
          swift build -c release
          cd ../..
          LD_LIBRARY_PATH="$PWD/ffi/active-infinity-ffi/target/release" \
            polyglot/swift/.build/release/Conformance

  polyglot-swift-windows:
    # XPL-INF-06: the Windows leg of `polyglot-swift`. The Swift package
    # links the FFI's shared import library on Windows
    # (`active_infinity_ffi.dll.lib`), which no Linux run can exercise.
    # INFORMATIONAL until green: add to the `polyglot-matrix` gate once
    # this job goes green. If the link or the run fails only on Windows
    # for a legitimate platform reason, the fix belongs to that finding -
    # never weaken this job to green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Swift conformance
        shell: bash
        run: |
          cd polyglot/swift
          swift build -c release
          BIN="$(swift build -c release --show-bin-path)"
          # The executable links the shared library: the `.dll` must sit
          # next to it at run time.
          cp ../../ffi/active-infinity-ffi/target/release/active_infinity_ffi.dll "$BIN/"
          cd ../..
          "$BIN/Conformance.exe"

  polyglot-assemblyscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the shared WASM module
        working-directory: ffi/active-infinity-ffi
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown
      - name: Compile the AssemblyScript shim
        run: |
          mkdir -p polyglot/assemblyscript/build
          npx --yes -p assemblyscript@0.27.31 asc polyglot/assemblyscript/assembly/index.ts \
            -o polyglot/assemblyscript/build/conformance.wasm --optimize
      - name: AssemblyScript conformance
        run: node polyglot/assemblyscript/test.js

  polyglot-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Julia conformance
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: julia polyglot/julia/conformance.jl

  polyglot-fortran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build the static library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Fortran conformance
        run: |
          gfortran -I polyglot/fortran polyglot/fortran/active_infinity.f90 \
            polyglot/fortran/conformance.f90 \
            ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
            -lpthread -ldl -lm -o conformance-fortran
          ./conformance-fortran

  polyglot-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install R
        run: sudo apt-get update && sudo apt-get install -y r-base-core
      - name: Build the shared library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Build the .C shim
        run: |
          gcc -shared -fPIC -O2 -I ffi/active-infinity-ffi/include \
            polyglot/r/native/active_infinity_r.c \
            ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
            -lpthread -ldl -lm -o polyglot/r/active_infinity_r.so
      - name: R conformance
        env:
          ACTIVE_INFINITY_LIB: ${{ github.workspace }}/ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.so
        run: Rscript polyglot/r/test_conformance.R

  polyglot-cobol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Build the static library
        working-directory: ffi/active-infinity-ffi
        run: cargo build --locked --release
      - name: Build the lane shim
        run: |
          gcc -shared -fPIC -O2 -I ffi/active-infinity-ffi/include \
            polyglot/cobol/native/active_infinity_cobol.c \
            ffi/active-infinity-ffi/target/release/libactive_infinity_ffi.a \
            -lpthread -ldl -lm -o polyglot/cobol/active_infinity_cobol.so
      - name: COBOL conformance
        run: |
          cobc -x -free -o conformance-cobol polyglot/cobol/conformance.cob \
            polyglot/cobol/active_infinity_cobol.so
          LD_LIBRARY_PATH="$PWD/ffi/active-infinity-ffi/target/release" ./conformance-cobol

  polyglot-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Shell/CLI conformance
        run: bash polyglot/shell/test.sh

  polyglot-rpc:
    # Same LTS pin as `polyglot-swift`: this job installs a Swift toolchain and
    # many distro packages, and `ubuntu-latest` is now 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Clone the RPC repository (thin peer)
        run: git clone --depth 1 https://github.com/Active-Official/active-rpc /tmp/rpc
      # `ACTIVE_RPC_STRICT` turns a missing runtime into a failure, so the
      # toolchain has to be installed rather than hoped for: the runner image
      # stopped shipping `swiftc` and the Swift row failed as "not installed".
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"
      - name: Install scripting runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full php-cli php-ffi luajit gcc g++ \
            r-base-core gfortran gnucobol
          sudo gem install ffi --no-document
      - name: Install Julia
        run: |
          curl -fL https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.3-linux-x86_64.tar.gz -o /tmp/julia.tar.gz
          tar -xzf /tmp/julia.tar.gz -C /opt
          echo "/opt/julia-1.13.3/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install the Kotlin compiler
        run: |
          curl -fL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install scala-cli
        run: |
          curl -fL https://github.com/VirtusLab/scala-cli/releases/download/v1.5.4/scala-cli-x86_64-pc-linux.gz \
            | gunzip > /tmp/scala-cli
          chmod +x /tmp/scala-cli
      - name: Cache Kotlin/Native
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/konan-cache
            ~/.konan
          key: konan-rpc-2.0.21
      - name: Run every thin RPC client
        env:
          SCALA_CLI: /tmp/scala-cli
          POLYGLOT_CACHE: /tmp/konan-cache
          ACTIVE_RPC_STRICT: "1"
        run: |
          mkdir -p /tmp/konan-cache
          # `golden` byte-compares every client's encoded request with the Rust
          # reference encoder. ACTIVE_RPC_STRICT turns a missing runtime into a
          # failure, so the job cannot go green by dropping a language.
          bash polyglot/rpc/run_clients.sh /tmp/rpc "$PWD" \
            python c cpp rust zig js ts go ruby php lua dart java kotlin scala csharp swift ktnative assemblyscript shell r julia fortran cobol golden

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # End-to-end CLI contract: help text, exit codes, validate/hash/decode,
      # dictionary round trip, microbench shape and the content-addressed store.
      - name: CLI tests
        working-directory: cli/active-infinity-cli
        run: cargo test --locked
      - name: CLI lint
        working-directory: cli/active-infinity-cli
        run: cargo clippy --locked --all-targets -- -D warnings

  polyglot-matrix:    # The C-8 release gate. Every language job must pass; one red language job
    # fails this aggregate gate, and with it phase C-8.
    if: always()
    needs:
      - abi
      - wasm
      - polyglot-native
      - polyglot-go
      - polyglot-ts
      - polyglot-scripting
      - polyglot-dotnet
      - polyglot-jvm
      - polyglot-swift
      - polyglot-kotlin-native
      - polyglot-assemblyscript
      - polyglot-shell
      - polyglot-julia
      - polyglot-fortran
      - polyglot-r
      - polyglot-cobol
      - polyglot-rpc
    runs-on: ubuntu-latest
    steps:
      - name: Require every language job to pass
        run: |
          failed=0
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "language job result: $result" >&2
              failed=1
            fi
          done
          exit "$failed"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
      # The committed lockfile is the tested graph: time 0.3.44 and proptest
      # 1.9.0 are the newest releases that still build on 1.85.
      - name: MSRV check (every feature, every target)
        run: cargo check --locked --all-targets --all-features
      - name: MSRV check (no default features)
        run: cargo check --locked --no-default-features

  api-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      # The authoritative check: the resolved public API, not a text scan.
      - name: Generate rustdoc JSON
        run: cargo +nightly rustdoc --locked --lib --all-features -- -Zunstable-options --output-format json
      - name: No public secret accessor
        run: python3 scripts/api_surface.py target/doc/active_infinity.json

  hardening-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A stale row, a missing test, or a critical invariant without a
      # negative-control plan fails the build.
      - name: Validate the hardening matrix
        run: python3 scripts/hardening_status.py --check

  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # A security test that still passes on a broken build proves nothing.
      - name: Every security-critical check must fail on a broken build
        run: python3 scripts/negative_controls.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Package (the tarball must build on its own)
        run: cargo package --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The corpus is committed under fuzz/corpus/<target>/. A short campaign
      # per target on every push and pull request; main and nightly run longer.
      - name: Bounded fuzz campaign (every target)
        run: |
          for target in \
            fuzz_decode_infinity \
            fuzz_stream_reassembly \
            fuzz_canonical_roundtrip \
            fuzz_layout_sections \
            fuzz_graph_cycles \
            fuzz_secret_positions \
            fuzz_unit_discriminants \
            fuzz_projection_agreement \
            fuzz_signed_image \
            fuzz_proof_sidecar \
            fuzz_schema \
            fuzz_delta_frames \
            fuzz_merge \
            fuzz_from_active_source \
            fuzz_train_dictionary \
            fuzz_store \
            fuzz_proof_verify_schema \
            fuzz_ffi_boundary \
            fuzz_cli_args \
            fuzz_redact_image \
            fuzz_stream_opts \
            fuzz_compressed_frame; do
            echo "== $target =="
            cargo fuzz run "$target" -- -runs=2000 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
          done
      # A crash is only actionable if the input survives the runner.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install audit tools
        run: cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisory audit
        # `--deny warnings` fails on any new unmaintained/unsound advisory. The
        # accepted one lives in `audit.toml` and `deny.toml`; the flag repeats it
        # so the gate holds on a `cargo-audit` build without config-file support.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0449
      - name: Dependency policy
        run: cargo deny check

  supply-chain-subcrates:
    # R2-SUPPLY-02: the root `supply-chain` job only covers the root graph.
    # The CLI, FFI, and fuzz crates are standalone packages with their own
    # lockfiles, so the policy must run in each crate dir with the root
    # configs. The configs are generated from the root files inside the
    # job - a committed copy would drift out of sync with the root.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [cli/active-infinity-cli, ffi/active-infinity-ffi, fuzz]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install audit tools
        run: cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Copy the root policy configs
        run: cp deny.toml audit.toml "${{ matrix.crate }}/"
      - name: Dependency policy
        working-directory: ${{ matrix.crate }}
        run: cargo deny check
      - name: Advisory audit
        working-directory: ${{ matrix.crate }}
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0449

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Every release ships a CycloneDX inventory of the exact locked graph.
      - name: Generate and verify the SBOM
        run: |
          mkdir -p dist
          python3 scripts/sbom.py --output dist/active-infinity.cdx.json
          python3 scripts/sbom.py --check dist/active-infinity.cdx.json
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: sbom
          path: dist/*.cdx.json
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --quiet pillow==12.3.0
      - name: README, theme-pair and logo integrity gate
        run: python scripts/check_presentation.py


  facades:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - active-infinity-core
          - active-infinity-stream
          - active-infinity-interop
          - active-infinity-wasm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Facade tests
        run: cargo test --manifest-path "facades/${{ matrix.crate }}/Cargo.toml"


[package]
name = "active-infinity"
version = "2.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Active Infinity (Active ∞) — binary, zero-copy, content-addressable, graph-native, unit-aware and secret-safe data language for Active modules and AI agents"
repository = "https://github.com/Active-Official/active-infinity"
homepage = "https://github.com/Active-Official/active-infinity"
documentation = "https://docs.rs/active-infinity"
readme = "README.md"
keywords = ["active", "binary", "serialization", "zero-copy", "agents"]
categories = ["encoding", "config", "data-structures"]
exclude = [
    "cli/**",
    "facades/**",
    "ffi/**",
    "polyglot/**",
    "target/**",
    ".scratch/**",
    "fuzz/corpus/**",
    "fuzz/artifacts/**",
    "fuzz/target/**",
]

[features]
default = ["active-core", "json"]
# Interoperability layer with the Active text language IR (`active_core`).
# Turn it off for a dependency-free wire codec.
active-core = ["dep:active-core"]
# Redacted JSON projection (`to_redacted_json`).
json = ["dep:serde_json"]
# Optional frame/payload compression. Content hashes stay over uncompressed bytes.
zstd = ["dep:zstd"]
# Detached Ed25519 signature envelope (store/AIR supply chain).
signatures = ["dep:ed25519-dalek"]

[dependencies]
blake3 = "1.5"
thiserror = "1.0"
active-core = { version = "1.4.0", optional = true }
serde_json = { version = "1.0", optional = true }
zstd = { version = "0.14", optional = true, default-features = false, features = ["zdict_builder"] }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
sha2 = "0.10"
criterion = "0.5"
blake3 = "1.5"
# Bakeoff competitors (C-7.3): same logical table, different wire formats.
prost = "0.13"
rkyv = { version = "0.8.17", features = ["alloc", "bytecheck"] }
serde_json = "1.0"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[lib]
name = "active_infinity"
path = "src/lib.rs"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[[test]]
name = "conformance_tests"
path = "tests/conformance_tests.rs"

[[test]]
name = "redteam_tests"
path = "tests/redteam_tests.rs"

[[test]]
name = "redteam_battery"
path = "tests/redteam_battery.rs"

[[test]]
name = "perf_budget"
path = "tests/perf_budget.rs"

[[test]]
name = "doc_gate"
path = "tests/doc_gate.rs"

[[test]]
name = "encode_batch_tests"
path = "tests/encode_batch_tests.rs"
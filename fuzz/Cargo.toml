[package]
name = "active-infinity-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
active-infinity = { path = "..", default-features = false, features = ["json", "zstd"] }


[package]
name = "active-infinity-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Production CLI for Active Infinity: encode, validate, hash, stream, conformance and content-addressed store"
repository = "https://github.com/Active-Official/active-infinity"
homepage = "https://github.com/Active-Official/active-infinity"
documentation = "https://docs.rs/active-infinity-cli"
readme = "README.md"
keywords = ["active", "infinity", "cli", "codec", "conformance"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
active-infinity = { path = "../..", version = "2.1.0", features = ["active-core", "json"] }
serde_json = "1"

[[bin]]
name = "active-infinity-cli"
path = "src/main.rs"

[package]
name = "active-infinity-fuzz"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The fuzz build must be the shipped default set: a panic in the default
# `active-core` bridge or in the signature envelope is otherwise unfuzzable.
active-infinity = { path = "..", version = "2.3.0", features = ["json", "zstd", "signatures"] }
# INF-POLY-05: the FFI boundary target links the shim; the CLI target links
# the CLI library (its parser lives there so it can be fuzzed in-process);
# the Active-source target needs the evaluator's Budget type.
active-infinity-ffi = { path = "../ffi/active-infinity-ffi", version = "0.1.0" }
active-infinity-cli = { path = "../cli/active-infinity-cli", version = "0.3.1" }
active-core = "1.4.0"

[[bin]]
name = "fuzz_decode_infinity"
path = "fuzz_targets/fuzz_decode_infinity.rs"
test = false
doc = false
bench = false


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --all-features
      - name: Tests (no default features)
        run: cargo test --no-default-features
      - name: Documentation
        run: cargo doc --no-deps --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: MSRV check
        run: cargo check --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package (no verify: path dependencies)
        run: cargo package --no-verify --allow-dirty

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed the corpus with the conformance vectors
        run: |
          mkdir -p fuzz/corpus/decode
          cp tests/vectors/valid/*.ainf tests/vectors/invalid/*.ainf fuzz/corpus/decode/
      - name: Bounded fuzz campaign
        run: cargo fuzz run decode -- -runs=20000

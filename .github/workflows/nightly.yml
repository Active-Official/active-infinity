name: Nightly coverage
# Action pins (R2-CI-01): every `uses:` in this file is pinned to a full
# 40-hex commit SHA, never a floating tag. SHAs for actions also used by
# active-rpc are copied verbatim from that repo's workflows; the rest are
# the upstream tag's commit at pin time (version in the trailing comment).
# The `pin-lint` job in ci.yml fails CI if any pin drifts; pins are kept
# current by Dependabot (`.github/dependabot.yml`, github-actions ecosystem).

# The fuzz campaign lives in `fuzz-nightly.yml` (the canonical lane: every
# target, a per-target time budget and artifact upload). This workflow keeps the
# coverage floor separate so the two campaigns do not duplicate work.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.19 --locked
      - name: Coverage floor
        run: |
          cargo llvm-cov --locked --all-features --json --summary-only --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json

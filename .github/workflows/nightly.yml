name: Nightly coverage

# The fuzz campaign lives in `fuzz-nightly.yml` (the canonical lane: every
# target, a per-target time budget and artifact upload). This workflow keeps the
# coverage floor separate so the two campaigns do not duplicate work.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage floor
        run: |
          cargo llvm-cov --locked --all-features --json --summary-only --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json
